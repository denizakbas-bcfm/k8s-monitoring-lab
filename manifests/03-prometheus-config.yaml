apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - http://web-sitem:80
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

  alert_rules.yml: |
    groups:
      - name: site_alarmlari
        rules:
          - alert: WebSiteDown
            expr: probe_success == 0
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "Web sitesi erişilemiyor!"
              description: "web-sitem servisi 10 saniyeden uzun süredir HTTP 200 vermiyor."
